<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhereWasI.ai — Back To It</title>
    <link rel="stylesheet" href="summary.css" />
  </head>
  <body>
    <header class="page-header">
      <p class="brand">✦ WhereWasI</p>
      <h1>BACK TO IT</h1>
    </header>

    <!-- Shown when neither activityBundle nor aiSnapshot exist in storage -->
    <div id="no-session-view" hidden>
      <p class="no-session-message">No session data found. Start a new work session.</p>
    </div>

    <!-- Shown once activityBundle is found in chrome.storage.local -->
    <div id="summary-content" hidden>
      <section class="info-card">
        <p class="section-label">🔍 You were exploring</p>
        <p class="section-content" id="summary-exploring"></p>
      </section>

      <section class="info-card">
        <p class="section-label">💡 You discovered</p>
        <p class="section-content" id="summary-discovered"></p>
      </section>

      <section class="info-card">
        <p class="section-label">📍 Last stop</p>
        <p class="section-content" id="summary-laststop"></p>
      </section>

      <section class="info-card">
        <p class="section-label">➡️ Next</p>
        <p class="section-content" id="summary-next"></p>
      </section>

      <button
        type="button"
        class="breakdown-toggle"
        id="breakdown-toggle"
        aria-expanded="false"
      >
        Detailed breakdown <span id="breakdown-arrow">↓</span>
      </button>

      <div class="breakdown-content" id="breakdown-content" hidden>
        <p class="breakdown-stats" id="summary-stats"></p>
        <table class="breakdown-table">
          <thead>
            <tr>
              <th>Page</th>
              <th>Domain</th>
              <th>Visits</th>
            </tr>
          </thead>
          <tbody id="summary-top-pages"></tbody>
        </table>
      </div>

      <button type="button" id="continue-btn">Continue where I left off →</button>
      <button type="button" id="new-work-btn">Start new work</button>
    </div>

    <script src="summary.js"></script>
  </body>
</html>
