<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhereWasI.ai — Detailed Summary</title>
    <link rel="stylesheet" href="summary.css" />
  </head>
  <body>
    <main class="summary-card" id="summary-view">
      <p class="brand"><span style="color: #00e5cc">✦</span> WhereWasI</p>
      <h1>Detailed Summary</h1>

      <section>
        <p class="label">What you explored</p>
        <p class="value" id="summary-topic">AI assessment platforms</p>
      </section>

      <section>
        <p class="label">Pages visited</p>
        <p class="value" id="summary-page-count">8</p>
      </section>

      <section>
        <p class="label">Key sources</p>
        <ul class="value-list" id="summary-sources">
          <li>Learnosity</li>
          <li>Competitor X</li>
          <li>Google</li>
        </ul>
      </section>

      <section>
        <p class="label">Repeated research</p>
        <p class="value" id="summary-repeated">Learnosity · AI Assessment ×3</p>
      </section>

      <section>
        <p class="label">Research trail</p>
        <p class="value muted" id="summary-trail">24 min · 8 pages · 3 revisits</p>
      </section>

      <button type="button" id="continue-btn">Continue where I left off →</button>
    </main>
  </body>
</html>
